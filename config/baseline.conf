# ==========================================================
# BASELINE DE CONFORMITE - DEBIAN 13 / NGINX
# ==========================================================

# --- SYSTEME ---
EXPECTED_OS="debian"
EXPECTED_VERSION="13"
EXPECTED_ARCH="amd64"

# Un seul compte UID 0
ALLOWED_UID0_USERS="root"

# --- RESEAU ---
ALLOWED_TCP_PORTS="22 80 443"

# Le port HTTP est autorisé uniquement pour redirection HTTPS
HTTP_PORT="80"
HTTPS_PORT="443"
REQUIRE_HTTP_REDIRECT="yes"

# Pare-feu obligatoire
REQUIRE_FIREWALL="yes"

# --- NGINX ---
NGINX_USER="www-data"
NGINX_SERVICE="nginx"
REQUIRE_NGINX_ENABLED="yes"

# --- TLS ---
TLS_ALLOWED_PROTOCOLS="TLSv1.2 TLSv1.3"
CERT_MIN_DAYS=30

# Algorithmes explicitement interdits
FORBIDDEN_CIPHERS="RC4 3DES DES NULL EXPORT MD5"

# --- STOCKAGE ---
MAX_DISK_USAGE=90
MAX_INODE_USAGE=90

# Répertoires Web
NGINX_CONFIG_DIR="/etc/nginx"
WEB_ROOT="/var/www"

# --- SERVICES ---
# Liste adaptée à notre serveur Debian/Nginx.
# On l'ajustera après installation de la VM si Debian ajoute
# un service système légitime nécessaire.
ALLOWED_SERVICES="nginx ssh cron systemd-journald systemd-logind dbus"

# --- PAQUETS ---
REQUIRE_AUTO_UPDATES="yes"

# Dépôts autorisés
ALLOWED_REPOSITORIES="deb.debian.org security.debian.org"

# Aucun paquet ne doit être volontairement bloqué
ALLOW_HELD_PACKAGES="no"
# --- FILESYSTEM ---

# Systèmes de fichiers explicitement interdits
FORBIDDEN_FILESYSTEMS="cramfs freevxfs hfs hfsplus jffs2"

# Options obligatoires sur les zones temporaires
TMP_REQUIRED_OPTIONS="nodev nosuid noexec"
DEVSHM_REQUIRED_OPTIONS="nodev nosuid noexec"

# Permissions maximales
NGINX_CONFIG_MAX_MODE="755"
WEB_ROOT_MAX_MODE="755"

# Propriétaires autorisés du contenu Web
WEB_ALLOWED_OWNERS="root www-data"

# Les clés privées TLS ne doivent être accessibles
# ni en écriture ni en lecture par "others".
TLS_KEY_MAX_MODE="640"
# --- NGINX / TLS ---

# Durée minimale restante du certificat
CERT_MIN_DAYS=30

# Protocoles TLS autorisés
TLS_ALLOWED_PROTOCOLS="TLSv1.2 TLSv1.3"

# Utilisateur attendu pour les workers
NGINX_USER="www-data"

# Services explicitement interdits sur le serveur
FORBIDDEN_SERVICES="telnet rsh rlogin vsftpd proftpd apache2"
# --- PAQUETS / MISES A JOUR ---

# Paquets indispensables
REQUIRED_PACKAGES="nginx openssl unattended-upgrades"

# Aucun paquet en hold
ALLOW_HELD_PACKAGES="no"

# Mises à jour automatiques obligatoires
REQUIRE_AUTO_UPDATES="yes"

# Dépôts autorisés
ALLOWED_REPOSITORIES="deb.debian.org security.debian.org"

# Paquets/services explicitement interdits
FORBIDDEN_PACKAGES="telnet rsh-client rsh-server talk ftp"
# Modules kernel interdits
FORBIDDEN_MODULES="cramfs freevxfs hfs hfsplus jffs2 squashfs udf usb-storage"

TLS_CERT_DIR="/etc/nginx/tls"
TLS_CERT_FILE="/etc/nginx/tls/server.crt"
TLS_KEY_FILE="/etc/nginx/tls/server.key"
TLS_CA_FILE="/etc/nginx/tls/ca.crt"
TLS_CA_KEY="/etc/nginx/tls/ca.key"
TLS_CERT_CN="debian13-nginx.local"
TLS_CERT_DAYS=365